<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SALET Decision Tree Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; color: #333; }
    .tabs { display: flex; gap: 8px; margin-bottom: 15px; border-bottom: 2px solid #ccc; padding-bottom: 8px; }
    .tab-btn { padding: 8px 16px; cursor: pointer; border: 1px solid #ccc; background: #f8f9fa; border-radius: 4px; font-weight: bold; }
    .tab-btn.active { background: #0366d6; color: white; border-color: #0366d6; }
    #output { overflow-x: auto; max-width: 100%; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; }
    th { background-color: #f1f3f5; position: sticky; top: 0; }
    tr:nth-child(even) { background-color: #f9f9f9; }
  </style>
</head>
<body>
  <h2>SALET Decision Tree Interactive Viewer</h2>
  <div class="tabs" id="tab-container"></div>
  <div id="output">Loading workbook sheets...</div>

  <script>
    fetch('SALET_decision_tree.xlsx')
      .then(res => res.arrayBuffer())
      .then(buffer => {
        const wb = XLSX.read(buffer, { type: 'array' });
        const container = document.getElementById('tab-container');
        container.innerHTML = '';

        wb.SheetNames.forEach((sheetName, idx) => {
          const btn = document.createElement('button');
          btn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
          btn.textContent = sheetName;
          btn.onclick = () => renderSheet(wb, sheetName, btn);
          container.appendChild(btn);
        });

        renderSheet(wb, wb.SheetNames[0], container.children[0]);
      })
      .catch(err => {
        document.getElementById('output').textContent = 'Error loading Excel file.';
        console.error(err);
      });

    function renderSheet(wb, sheetName, activeBtn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      activeBtn.classList.add('active');
      const ws = wb.Sheets[sheetName];
      document.getElementById('output').innerHTML = XLSX.utils.sheet_to_html(ws);
    }
  </script>
</body>
</html>
